apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: kubeops
  labels:
    app.kubernetes.io/component: victoria-metrics-operator
spec:
  interval: 5m
  timeout: 30m
  releaseName: victoria-metrics-operator
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.67.3"
      sourceRef:
        kind: HelmRepository
        name: appscode-charts-oci
        namespace: kubeops
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
