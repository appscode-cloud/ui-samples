apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-nats
  namespace: kubeops
  labels:
    app.kubernetes.io/component: otel-nats
spec:
  interval: 5m
  timeout: 30m
  releaseName: otel-nats
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: otel-nats
      version: "v2026.9.22"
      sourceRef:
        kind: HelmRepository
        name: appscode-charts-oci
        namespace: kubeops
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
